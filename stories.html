<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصص النجاح</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard.html"><img src="/images/logo.png" alt="logo"><span data-i18n="app">رحلة مشروع</span></a><div class="spacer"></div><select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option></select><a class="icon-btn" href="/search.html">⌕</a><a class="icon-btn" href="/notifications.html">🔔</a><a class="avatar" data-avatar href="/profile.html">م</a></div></header><div class="layout"><aside class="sidebar"><nav class="side-nav"><a href="/dashboard.html" data-i18n="home">الرئيسية</a><a href="/projects.html" data-i18n="projects">المشاريع</a><a href="/new-project.html" data-i18n="newProject">إنشاء مشروع</a><a href="/community.html" data-i18n="community">المجتمع</a><a href="/stories.html" data-i18n="stories">قصص النجاح</a><a href="/assistant.html" data-i18n="assistant">المساعد الذكي</a><a href="/chat.html">الدردشات</a><a href="/admin.html" data-admin-only class="hidden" data-i18n="admin">المشرفون</a><a href="#" onclick="logout()" data-i18n="logout">تسجيل الخروج</a></nav></aside><main class="main"><div class="section-title"><div><h1 data-i18n="stories">قصص النجاح</h1><p class="muted">تعرض فقط القصص التي اعتمدها المشرف.</p></div><a class="btn" href="/publish-story.html" data-i18n="publishStory">إضافة قصة</a></div><div class="field"><input id="storySearch" class="search" placeholder="البحث عن قصة"></div><div id="storiesList" class="grid three"></div></main></div><div class="bottom-space"></div><nav class="bottom-nav"><a href="/dashboard.html">⌂<br><span data-i18n="home">الرئيسية</span></a><a href="/projects.html">▣<br><span data-i18n="projects">المشاريع</span></a><a href="/new-project.html">＋<br><span data-i18n="newProject">إنشاء</span></a><a href="/community.html">◉<br><span data-i18n="community">المجتمع</span></a><a href="/assistant.html">✦<br><span data-i18n="assistant">المساعد</span></a><a href="/profile.html">●<br><span data-i18n="profile">الحساب</span></a></nav><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script><script>let storyRows=[];function renderStories(q=''){const list=document.querySelector('#storiesList');const rows=storyRows.filter(x=>(x.title+' '+x.summary+' '+x.name).toLowerCase().includes(q.toLowerCase()));list.innerHTML=rows.length?rows.map(x=>`<a class="card" href="/story-details.html?id=${x.id}"><span class="badge">${safe(x.name)}</span><h3>${safe(x.title)}</h3><p class="muted">${safe(x.summary)}</p></a>`).join(''):'<div class="empty">لا توجد قصص معتمدة.</div>'}document.addEventListener('DOMContentLoaded',async()=>{storyRows=await api('/api/stories');renderStories();document.querySelector('#storySearch').oninput=e=>renderStories(e.target.value)})</script></body></html>
