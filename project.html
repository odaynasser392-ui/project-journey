<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشروع</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard.html"><img src="/images/logo.png" alt="logo"><span data-i18n="app">رحلة مشروع</span></a><div class="spacer"></div><select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option></select><a class="icon-btn" href="/search.html">⌕</a><a class="icon-btn" href="/notifications.html">🔔</a><a class="avatar" data-avatar href="/profile.html">م</a></div></header><div class="layout"><aside class="sidebar"><nav class="side-nav"><a href="/dashboard.html" data-i18n="home">الرئيسية</a><a href="/projects.html" data-i18n="projects">المشاريع</a><a href="/new-project.html" data-i18n="newProject">إنشاء مشروع</a><a href="/community.html" data-i18n="community">المجتمع</a><a href="/stories.html" data-i18n="stories">قصص النجاح</a><a href="/assistant.html" data-i18n="assistant">المساعد الذكي</a><a href="/chat.html">الدردشات</a><a href="/admin.html" data-admin-only class="hidden" data-i18n="admin">المشرفون</a><a href="#" onclick="logout()" data-i18n="logout">تسجيل الخروج</a></nav></aside><main class="main"><div id="projectView" class="empty">جاري التحميل...</div></main></div><div class="bottom-space"></div><nav class="bottom-nav"><a href="/dashboard.html">⌂<br><span data-i18n="home">الرئيسية</span></a><a href="/projects.html">▣<br><span data-i18n="projects">المشاريع</span></a><a href="/new-project.html">＋<br><span data-i18n="newProject">إنشاء</span></a><a href="/community.html">◉<br><span data-i18n="community">المجتمع</span></a><a href="/assistant.html">✦<br><span data-i18n="assistant">المساعد</span></a><a href="/profile.html">●<br><span data-i18n="profile">الحساب</span></a></nav><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');const p=await api('/api/projects/'+id);document.querySelector('#projectView').className='';document.querySelector('#projectView').innerHTML=`<div class="section-title"><div><h1>${safe(p.name)}</h1><p class="muted">${safe(p.description)}</p></div><span class="status">${safe(p.status)}</span></div><div class="grid two"><form id="editProject" class="card form"><h2>بيانات المشروع</h2><div class="field"><label>الاسم</label><input name="name" value="${safe(p.name)}" required></div><div class="field"><label>الوصف</label><textarea name="description" required>${safe(p.description)}</textarea></div><div class="field"><label>المجال</label><input name="field" value="${safe(p.field)}"></div><div class="field"><label>الميزانية</label><input name="budget" type="number" value="${p.budget}"></div><div class="field"><label>الهدف</label><textarea name="goal">${safe(p.goal)}</textarea></div><div class="grid two"><div class="field"><label>الحالة</label><select name="status"><option value="idea">فكرة</option><option value="planning">تخطيط</option><option value="execution">تنفيذ</option><option value="launched">إطلاق</option></select></div><div class="field"><label>التقدم %</label><input name="progress" type="number" min="0" max="100" value="${p.progress}"></div></div><button class="btn">حفظ</button></form><div class="card"><h2>المهام</h2><form id="taskForm" class="form"><div class="field"><input name="title" placeholder="عنوان المهمة" required></div><div class="field"><input name="due_date" type="date"></div><button class="btn">إضافة مهمة</button></form><div class="list" id="tasks">${p.tasks.length?p.tasks.map(t=>`<div class="list-item"><div class="grow">${safe(t.title)}</div><span class="status">${safe(t.state)}</span></div>`).join(''):'<div class="empty">لا توجد مهام.</div>'}</div></div></div>`;document.querySelector('[name=status]').value=p.status;document.querySelector('#editProject').onsubmit=async e=>{e.preventDefault();await api('/api/projects/'+id,{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('تم الحفظ')};document.querySelector('#taskForm').onsubmit=async e=>{e.preventDefault();await api('/api/projects/'+id+'/tasks',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.reload()}})</script></body></html>
