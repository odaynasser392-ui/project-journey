<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدردشات</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard.html"><img src="/images/logo.png" alt="logo"><span data-i18n="app">رحلة مشروع</span></a><div class="spacer"></div><select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option></select><a class="icon-btn" href="/search.html">⌕</a><a class="icon-btn" href="/notifications.html">🔔</a><a class="avatar" data-avatar href="/profile.html">م</a></div></header><div class="layout"><aside class="sidebar"><nav class="side-nav"><a href="/dashboard.html" data-i18n="home">الرئيسية</a><a href="/projects.html" data-i18n="projects">المشاريع</a><a href="/new-project.html" data-i18n="newProject">إنشاء مشروع</a><a href="/community.html" data-i18n="community">المجتمع</a><a href="/stories.html" data-i18n="stories">قصص النجاح</a><a href="/assistant.html" data-i18n="assistant">المساعد الذكي</a><a href="/chat.html">الدردشات</a><a href="/admin.html" data-admin-only class="hidden" data-i18n="admin">المشرفون</a><a href="#" onclick="logout()" data-i18n="logout">تسجيل الخروج</a></nav></aside><main class="main"><div class="section-title"><h1>الدردشات بين المستخدمين</h1></div><div class="chat-layout"><aside class="card"><h3>المستخدمون</h3><div id="users" class="list"></div></aside><section class="card chat-box"><div id="chatTitle"><strong>اختر مستخدمًا</strong></div><div id="messages" class="messages"></div><form id="messageForm" class="chat-send"><input name="body" class="search" placeholder="اكتب رسالة" required><button class="btn" data-i18n="send">إرسال</button></form></section></div></main></div><div class="bottom-space"></div><nav class="bottom-nav"><a href="/dashboard.html">⌂<br><span data-i18n="home">الرئيسية</span></a><a href="/projects.html">▣<br><span data-i18n="projects">المشاريع</span></a><a href="/new-project.html">＋<br><span data-i18n="newProject">إنشاء</span></a><a href="/community.html">◉<br><span data-i18n="community">المجتمع</span></a><a href="/assistant.html">✦<br><span data-i18n="assistant">المساعد</span></a><a href="/profile.html">●<br><span data-i18n="profile">الحساب</span></a></nav><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script><script>let selected=null,me=null;async function openChat(id,name){selected=id;document.querySelector('#chatTitle').innerHTML=`<strong>${safe(name)}</strong>`;const rows=await api('/api/messages/'+id);document.querySelector('#messages').innerHTML=rows.map(x=>`<div class="message ${x.sender_id===me.id?'mine':''}">${safe(x.body)}</div>`).join('')}document.addEventListener('DOMContentLoaded',async()=>{me=await currentUser();const users=await api('/api/users');document.querySelector('#users').innerHTML=users.length?users.map(x=>`<button class="list-item" onclick="openChat(${x.id},'${safe(x.name).replace(/'/g,'&#39;')}')"><span class="avatar">${safe(x.name[0])}</span><span>${safe(x.name)}</span></button>`).join(''):'<div class="empty">لا يوجد مستخدمون آخرون.</div>'});document.querySelector('#messageForm').onsubmit=async e=>{e.preventDefault();if(!selected)return toast('اختر مستخدمًا');await api('/api/messages/'+selected,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();openChat(selected,document.querySelector('#chatTitle').innerText)}</script></body></html>
