<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشرفون</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard.html"><img src="/images/logo.png" alt="logo"><span data-i18n="app">رحلة مشروع</span></a><div class="spacer"></div><select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option></select><a class="icon-btn" href="/search.html">⌕</a><a class="icon-btn" href="/notifications.html">🔔</a><a class="avatar" data-avatar href="/profile.html">م</a></div></header><div class="layout"><aside class="sidebar"><nav class="side-nav"><a href="/dashboard.html" data-i18n="home">الرئيسية</a><a href="/projects.html" data-i18n="projects">المشاريع</a><a href="/new-project.html" data-i18n="newProject">إنشاء مشروع</a><a href="/community.html" data-i18n="community">المجتمع</a><a href="/stories.html" data-i18n="stories">قصص النجاح</a><a href="/assistant.html" data-i18n="assistant">المساعد الذكي</a><a href="/chat.html">الدردشات</a><a href="/admin.html" data-admin-only class="hidden" data-i18n="admin">المشرفون</a><a href="#" onclick="logout()" data-i18n="logout">تسجيل الخروج</a></nav></aside><main class="main"><div class="section-title"><h1>صفحة المشرفين</h1></div><div id="adminView" class="empty">جاري التحميل...</div></main></div><div class="bottom-space"></div><nav class="bottom-nav"><a href="/dashboard.html">⌂<br><span data-i18n="home">الرئيسية</span></a><a href="/projects.html">▣<br><span data-i18n="projects">المشاريع</span></a><a href="/new-project.html">＋<br><span data-i18n="newProject">إنشاء</span></a><a href="/community.html">◉<br><span data-i18n="community">المجتمع</span></a><a href="/assistant.html">✦<br><span data-i18n="assistant">المساعد</span></a><a href="/profile.html">●<br><span data-i18n="profile">الحساب</span></a></nav><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const d=await api('/api/admin/overview');document.querySelector('#adminView').className='';document.querySelector('#adminView').innerHTML=`<div class="stats">${Object.entries(d.counts).map(([k,v])=>`<div class="card stat"><small>${safe(k)}</small><br><strong>${v}</strong></div>`).join('')}</div><section class="section"><h2>القصص بانتظار المراجعة</h2><div class="list">${d.pending.length?d.pending.map(x=>`<div class="card admin-row"><div><strong>${safe(x.title)}</strong><p>${safe(x.summary)}</p><small>${safe(x.name)}</small><br><a href="${safe(x.evidence_path)}" target="_blank">عرض الإثبات</a></div><div class="actions"><button class="btn" onclick="review(${x.id},'approved')">اعتماد</button><button class="btn danger" onclick="review(${x.id},'rejected')">رفض</button></div></div>`).join(''):'<div class="empty">لا توجد قصص معلقة.</div>'}</div></section>`}catch(e){document.querySelector('#adminView').textContent='هذه الصفحة للمشرف فقط.'}});async function review(id,status){const note=prompt('ملاحظة المشرف (اختيارية)')||'';await api('/api/admin/stories/'+id,{method:'PUT',body:JSON.stringify({status,admin_note:note})});location.reload()}</script></body></html>
