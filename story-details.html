<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل القصة</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard.html"><img src="/images/logo.png" alt="logo"><span data-i18n="app">رحلة مشروع</span></a><div class="spacer"></div><select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option></select><a class="icon-btn" href="/search.html">⌕</a><a class="icon-btn" href="/notifications.html">🔔</a><a class="avatar" data-avatar href="/profile.html">م</a></div></header><div class="layout"><aside class="sidebar"><nav class="side-nav"><a href="/dashboard.html" data-i18n="home">الرئيسية</a><a href="/projects.html" data-i18n="projects">المشاريع</a><a href="/new-project.html" data-i18n="newProject">إنشاء مشروع</a><a href="/community.html" data-i18n="community">المجتمع</a><a href="/stories.html" data-i18n="stories">قصص النجاح</a><a href="/assistant.html" data-i18n="assistant">المساعد الذكي</a><a href="/chat.html">الدردشات</a><a href="/admin.html" data-admin-only class="hidden" data-i18n="admin">المشرفون</a><a href="#" onclick="logout()" data-i18n="logout">تسجيل الخروج</a></nav></aside><main class="main"><div id="storyView" class="empty">جاري التحميل...</div></main></div><div class="bottom-space"></div><nav class="bottom-nav"><a href="/dashboard.html">⌂<br><span data-i18n="home">الرئيسية</span></a><a href="/projects.html">▣<br><span data-i18n="projects">المشاريع</span></a><a href="/new-project.html">＋<br><span data-i18n="newProject">إنشاء</span></a><a href="/community.html">◉<br><span data-i18n="community">المجتمع</span></a><a href="/assistant.html">✦<br><span data-i18n="assistant">المساعد</span></a><a href="/profile.html">●<br><span data-i18n="profile">الحساب</span></a></nav><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');const s=await api('/api/stories/'+id);document.querySelector('#storyView').className='grid two';document.querySelector('#storyView').innerHTML=`<article class="card"><span class="badge">${safe(s.name)}</span><h1>${safe(s.title)}</h1><p class="muted">${safe(s.summary)}</p><div class="story-content">${safe(s.content)}</div></article><aside class="card ai-panel"><h2>قراءة القصة بالذكاء الاصطناعي</h2><p class="muted">التحليل يعتمد على نص القصة المنشور فقط.</p><button id="analyzeStory" class="btn">تحليل القصة</button><div id="storyAI"></div></aside>`;document.querySelector('#analyzeStory').onclick=async()=>{const r=await api('/api/ai/analyze',{method:'POST',body:JSON.stringify({text:s.content})});document.querySelector('#storyAI').innerHTML=`<h3>ملخص</h3><p>${safe(r.summary)}</p>${r.findings.map(x=>`<div class="list-item">${safe(x)}</div>`).join('')}<p class="muted">${safe(r.note)}</p>`}})</script></body></html>
