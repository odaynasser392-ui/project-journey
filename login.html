<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>login</title><link rel="icon" href="/images/logo.png"><link rel="stylesheet" href="/css/style.css"></head><body dir="rtl"><main class="auth"><section class="auth-card"><img class="auth-logo" src="/images/logo.png"><h1 data-i18n="login">تسجيل الدخول</h1><form id="authForm" class="form"><div class="field"><label data-i18n="email">البريد الإلكتروني</label><input name="email" type="email" required></div><div class="field"><label data-i18n="password">كلمة المرور</label><input name="password" type="password" minlength="6" required></div><button class="btn" data-i18n="login">تسجيل الدخول</button></form><p class="muted"><a href="/signup.html">إنشاء حساب جديد</a></p></section></main><script src="/js/i18n.js"></script><script src="/js/app.js"></script><script>document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.language=lang();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(o)});location.href='/dashboard.html'}catch(x){toast(x.message)}}</script></body></html>
